<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rock Paper Scissors</title><style>body{margin:0;min-height:100vh;background:#000;color:#ddd;font:18px "Courier New",monospace;display:grid;place-items:center}.terminal{width:min(92vw,800px);border:2px solid #777;padding:24px;box-sizing:border-box}button{background:#111;color:#fff;border:1px solid #777;padding:10px 15px;margin:5px;font:inherit;cursor:pointer}pre{white-space:pre-wrap;border-top:1px solid #555;margin-top:20px;padding-top:20px;min-height:280px}</style></head><body><main class="terminal"><h2>=== ROCK PAPER SCISSORS ===</h2><p>Choose your hand:</p><button onclick="play(1)">1 — ROCK</button><button onclick="play(2)">2 — PAPER</button><button onclick="play(3)">3 — SCISSORS</button><button onclick="compileGame()">COMPILE C++</button><pre id="out">C++ game ready.</pre></main><script>const out=document.getElementById('out');async function play(n){out.textContent='Running C++...';const r=await fetch('/api/run',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({input:String(n)})});const j=await r.json();out.textContent=j.output}async function compileGame(){out.textContent='Compiling...';const r=await fetch('/api/compile',{method:'POST'});const j=await r.json();out.textContent=j.output}</script></body></html>
