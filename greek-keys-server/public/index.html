<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Greek Keys</title><style>body{margin:0;background:#080808;color:#eee;font-family:Georgia,serif}.wrap{max-width:760px;margin:auto;padding:35px 20px}h1{font-size:54px;margin:0}.sub{color:#aaa}.card{border:1px solid #555;padding:30px;margin-top:30px;text-align:center}.symbol{font-size:100px}.name{font-size:28px}.suggestion{margin:18px auto;padding:14px 16px;max-width:560px;border:1px solid #444;background:#111;color:#d8d8d8;text-align:left}.suggestion strong{color:#fff}textarea{width:100%;height:100px;box-sizing:border-box;background:#111;color:#fff;border:1px solid #666;padding:12px;font-size:17px}button{padding:12px 18px;margin:12px 5px 0 0;background:#222;color:#fff;border:1px solid #777}.progress{font-family:monospace;color:#bbb}.done{display:none}a{color:#ddd}</style></head><body><main class="wrap"><h1>Greek Keys</h1><p class="sub">48 keys · 24 uppercase · 24 lowercase</p><div id="game" class="card"><div id="progress" class="progress"></div><div id="symbol" class="symbol"></div><div id="name" class="name"></div><div class="suggestion"><strong>Suggested response:</strong> <span id="suggestion"></span></div><p>Write your own association for this key:</p><textarea id="answer"></textarea><br><button id="useSuggestion">USE SUGGESTION</button><button id="next">SAVE KEY & CONTINUE</button></div><div id="done" class="card done"><h2>48 / 48 Complete</h2><p>Your Greek Keys UTF-8 text file is ready.</p><button id="download">DOWNLOAD greek_keys.txt</button><button onclick="location.reload()">NEW SESSION</button></div></main><script>const base=[['Alpha','Α','α','Beginning, initiative, first principle','Start the task now'],['Beta','Β','β','Testing, revision, second attempt','Try a revised version'],['Gamma','Γ','γ','Growth, change, expansion','Expand the idea one step'],['Delta','Δ','δ','Difference, transition, transformation','Change one variable'],['Epsilon','Ε','ε','Small change, precision, tolerance','Make a tiny adjustment'],['Zeta','Ζ','ζ','Motion, continuation, sequence','Continue to the next step'],['Eta','Η','η','Efficiency, balance, effectiveness','Choose the more efficient option'],['Theta','Θ','θ','Angle, perspective, viewpoint','Look from another perspective'],['Iota','Ι','ι','Smallest detail, minimal change','Notice the smallest detail'],['Kappa','Κ','κ','Structure, curvature, consistency','Check the structure'],['Lambda','Λ','λ','Wavelength, creativity, variation','Create a new variation'],['Mu','Μ','μ','Average, central tendency, measure','Find the typical value'],['Nu','Ν','ν','Frequency, repetition, rate','Repeat and observe the rate'],['Xi','Ξ','ξ','Complexity, hidden structure, randomness','Look for the hidden pattern'],['Omicron','Ο','ο','Cycle, enclosure, completeness','Close the loop'],['Pi','Π','π','Circle, periodicity, proportion','Compare the proportion'],['Rho','Ρ','ρ','Density, correlation, closeness','Check what moves together'],['Sigma','Σ','σ','Summation, total, accumulation','Add the pieces together'],['Tau','Τ','τ','Time, period, duration','Measure how long it takes'],['Upsilon','Υ','υ','Branching, choice, divergence','Choose between two paths'],['Phi','Φ','φ','Proportion, harmony, phase','Look for balance or phase'],['Chi','Χ','χ','Comparison, crossing, interaction','Compare two interacting parts'],['Psi','Ψ','ψ','State, mind, wave function','Observe the current state'],['Omega','Ω','ω','Completion, limit, final state','Finish and review the result']];const keys=[...base.map(x=>({name:x[0],letter:x[1],case:'Uppercase',suggestion:x[3]})),...base.map(x=>({name:x[0],letter:x[2],case:'Lowercase',suggestion:x[4]}))];let i=0,entries=[],fileText='';const q=x=>document.getElementById(x);function show(){const k=keys[i];q('progress').textContent=`KEY ${i+1} / 48`;q('symbol').textContent=k.letter;q('name').textContent=`${k.name} · ${k.case}`;q('suggestion').textContent=k.suggestion;q('answer').value='';q('answer').focus()}q('useSuggestion').onclick=()=>{q('answer').value=keys[i].suggestion;q('answer').focus()};q('next').onclick=async()=>{entries.push({...keys[i],association:q('answer').value});i++;if(i<48)return show();q('game').style.display='none';q('done').style.display='block';const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json; charset=utf-8'},body:JSON.stringify({entries})});const j=await r.json();if(j.ok)fileText=j.text;else q('done').innerHTML+='<p>'+j.error+'</p>'};q('download').onclick=()=>{if(!fileText)return;const utf8BOM='\uFEFF';const b=new Blob([utf8BOM,fileText],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='greek_keys.txt';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};show();</script></body></html>
